{% extends 'base.html' %}

{% block title %}Редагувати профіль — OLX{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-0 shadow-sm p-4 bg-white" style="border-radius: 4px;">
            <h1 class="h3 fw-bold mb-4" style="color: var(--olx-brand);">Редагувати налаштування</h1>
            
            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                
                <div class="mb-3">
                    <label class="form-label fw-bold" style="color: var(--olx-brand);">Номер телефону</label>
                    {{ form.phone_number }}
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold" style="color: var(--olx-brand);">Місто проживання</label>
                    {{ form.city }}
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold" style="color: var(--olx-brand);">Аватарка профілю</label>
                    {{ form.avatar }}
                </div>

                <div class="d-flex gap-2">
                    <a href="{% url 'profile' %}" class="btn btn-light w-50 fw-bold py-2 border">Скасувати</a>
                    <button type="submit" class="btn text-white w-50 fw-bold py-2 border-0" style="background-color: var(--olx-brand);">Зберегти</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
