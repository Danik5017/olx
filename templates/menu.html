<nav class="navbar navbar-expand-lg navbar-dark sticky-top shadow-sm" style="background-color: var(--olx-brand); padding: 15px 0;">
    <div class="container flex-column gap-3">
        
        <!-- Верхня панель: Логотип + Кнопки профілю (Є на всіх сторінках) -->
        <div class="d-flex align-items-center justify-content-between w-100">
            <a class="navbar-brand fw-bold fs-3 text-white m-0" href="{% url 'index' %}">
                OLX<span style="color: var(--olx-mint);">.ua</span>
            </a>

            <div class="d-flex align-items-center gap-3">
                {% if user.is_authenticated %}
                    <a href="{% url 'chats_list' %}" class="text-white text-decoration-none fs-5 px-1" title="Повідомлення">
                        <i class="bi bi-chat-left-text"></i>
                    </a>
                    <a href="{% url 'profile' %}" class="btn btn-outline-light fw-bold py-2 px-3" style="font-size: 15px;">
                        <i class="bi bi-person-circle me-1"></i> Мій профіль
                    </a>
                    <a href="{% url 'create_listing' %}" class="btn fw-bold py-2 px-3" style="background-color: #fff; color: var(--olx-brand); font-size: 15px;">
                        Подати оголошення
                    </a>
                {% else %}
                    <a href="{% url 'login' %}" class="text-white fw-bold text-decoration-none px-2">Увійти</a>
                    <a href="{% url 'register' %}" class="btn btn-outline-light fw-bold py-2 px-3">Реєстрація</a>
                {% endif %}
            </div>
        </div>

        <!-- Нижня панель: Пошуковий рядок (Показується ТІЛЬКИ на головній сторінці '/') -->
        {% if request.path == '/' %}
        <form method="GET" action="{% url 'search_listings' %}" class="d-flex w-100 mt-1">
            <div class="input-group">
                <input type="text" name="q" value="{{ query|default:'' }}" class="form-control border-0 py-3 ps-4" placeholder="Що шукаєте? Наприклад: авто, телефон, дитячі речі..." style="border-radius: 4px 0 0 4px; font-size: 16px;" required>
                <button class="btn px-5 fw-bold text-dark" type="submit" style="background-color: var(--olx-mint); border-radius: 0 4px 4px 0; border: none; font-size: 16px;">
                    <i class="bi bi-search me-2"></i> Пошук
                </button>
            </div>
        </form>
        {% endif %}

    </div>
</nav>
