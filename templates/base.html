<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        {% block title %} Сайт {% endblock %}
    </title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- Підключення HTMX -->
    <script src="https://unpkg.com" integrity="sha384-HGfztofot7shOIYCH8wOHJKX79Nl9QXxgUt75JI7C9gKk04FM27X8A6EAMv7vvIF" crossorigin="anonymous"></script>

    <!-- Налаштування палітри кольорів OLX -->
    <style>
        :root {
            --olx-brand: #002f34;
            --olx-mint: #23e5db;
            --olx-bg: #f2f4f5;
            --olx-text: #002f34;
            --olx-gray: #406367;
            --olx-light-gray: #7f9799;
        }
        body {
            background-color: var(--olx-bg);
            color: var(--olx-text);
        }
    </style>

    <!-- Custom CSS -->
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    {% include 'menu.html' %}
    <main class="container my-4">
    {% block content %}

    {% endblock %}
    </main>
    {% include 'footer.html' %}
    <!-- JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="{% static 'js/script.js' %}"></script>
</body>
</html>
